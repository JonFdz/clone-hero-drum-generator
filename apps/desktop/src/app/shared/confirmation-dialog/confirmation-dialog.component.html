@if (isOpen) {
	<div class="dialog-backdrop" role="presentation" (click)="cancelled.emit()">
		<section
			class="dialog"
			role="dialog"
			aria-modal="true"
			aria-labelledby="chdg-confirmation-dialog-title"
			(click)="$event.stopPropagation()"
		>
			<h2 id="chdg-confirmation-dialog-title">{{ title }}</h2>
			@if (message) {
				<p>{{ message }}</p>
			}
			<div class="dialog-actions">
				<button
					class="button ghost"
					type="button"
					(click)="cancelled.emit()"
				>
					{{ cancelLabel }}
				</button>
				<button
					class="button"
					[class.danger]="destructive"
					[class.secondary]="!destructive"
					type="button"
					(click)="confirmed.emit()"
				>
					{{ confirmLabel }}
				</button>
			</div>
		</section>
	</div>
}
