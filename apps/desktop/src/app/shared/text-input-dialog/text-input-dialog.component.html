@if (isOpen) {
	<div
		class="dialog-backdrop"
		role="presentation"
		(click)="cancelled.emit()"
	>
		<section
			class="dialog"
			role="dialog"
			aria-modal="true"
			aria-labelledby="chdg-text-input-dialog-title"
			(click)="$event.stopPropagation()"
		>
			<h2 id="chdg-text-input-dialog-title">{{ title }}</h2>
			@if (message) {
				<p>{{ message }}</p>
			}
			<label class="field">
				<span class="field-label">Value</span>
				<input
					class="field-input"
					type="text"
					[value]="value"
					[placeholder]="placeholder"
					(input)="value = $any($event.target).value"
					(keyup.enter)="onConfirm()"
				/>
			</label>
			<div class="dialog-actions">
				<button class="button ghost" type="button" (click)="cancelled.emit()">
					{{ cancelLabel }}
				</button>
				<button
					class="button secondary"
					type="button"
					[disabled]="confirmDisabled"
					(click)="onConfirm()"
				>
					{{ confirmLabel }}
				</button>
			</div>
		</section>
	</div>
}
