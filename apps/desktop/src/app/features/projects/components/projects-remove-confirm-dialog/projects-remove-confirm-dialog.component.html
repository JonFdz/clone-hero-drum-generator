@if (isOpen) {
   <div class="dialog-backdrop" role="presentation" (click)="cancelled.emit()">
				<section class="dialog" role="dialog" aria-modal="true" aria-labelledby="remove-title" (click)="$event.stopPropagation()">
					<h2 id="remove-title">Remove this project?</h2>
					<p>This removes the project from the recent list. The canonical project folder and all of its files remain on disk.</p>
					<div class="project-summary">
						<strong>{{ projectName }}</strong>
						<span>{{ projectPath }}</span>
					</div>
					<div class="dialog-actions">
		<button class="button ghost" type="button" (click)="cancelled.emit()">Cancel</button>
						<button class="button secondary" type="button" (click)="removeFromRecents.emit()">Remove from Recents</button>
					</div>
				</section>
			</div>
		}
