@if (isOpen) {
	<div class="dialog-backdrop" role="presentation" (click)="cancelled.emit()">
		<section
			class="dialog"
			role="dialog"
			aria-modal="true"
			aria-labelledby="chdg-profile-metadata-title"
			(click)="$event.stopPropagation()"
		>
			<h2 id="chdg-profile-metadata-title">{{ title }}</h2>
			@if (message) {
				<p>{{ message }}</p>
			}
			<label class="field">
				<span class="field-label">Name</span>
				<input
					class="field-input"
					type="text"
					[value]="name"
					(input)="name = $any($event.target).value"
					(keyup.enter)="onConfirm()"
				/>
			</label>
			<label class="field">
				<span class="field-label">Description (optional)</span>
				<input
					class="field-input"
					type="text"
					[value]="description"
					placeholder="Optional"
					(input)="description = $any($event.target).value"
				/>
			</label>
			<div class="dialog-actions">
				<button
					class="button ghost"
					type="button"
					(click)="cancelled.emit()"
				>
					{{ cancelLabel }}
				</button>
				<button
					class="button secondary"
					type="button"
					[disabled]="confirmDisabled"
					(click)="onConfirm()"
				>
					{{ confirmLabel }}
				</button>
			</div>
		</section>
	</div>
}
