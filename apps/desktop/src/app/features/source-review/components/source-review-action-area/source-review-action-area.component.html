<div class="source-review-actions">
	<button
		class="button ghost back-button"
		type="button"
		(click)="back.emit()"
	>
		<span aria-hidden="true">←</span> Back to Project Details
	</button>
	<button
		class="button primary continue-button"
		type="button"

		title="Managed generation is unavailable in this migration."

	</button>
</div>

	Runtime review is session-only. Continuing to managed generation is unavailable
	in this migration.
</p>
