<section class="highway-card">
	<div class="highway-header">
		<div>
			<h2>Highway</h2>
			<p>Read-only generated-chart playback view with four pitched lanes and a separate kick rail.</p>
		</div>
		<span class="read-only-pill">Read only</span>
	</div>

	<div class="canvas-shell" #container>
		<canvas
			#canvas
			class="highway-canvas"
			role="img"
			aria-label="Read-only drum highway preview with four pitched lanes and a separate kick rail"
		></canvas>
	</div>

	<p class="highway-summary">
		{{ accessibleSummary() }}
	</p>
</section>
